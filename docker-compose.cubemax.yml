name: cubemax

services:
  postgres:
    image: postgres:17.6
    container_name: cubemax-postgres
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      POSTGRES_USER: cubemax
      POSTGRES_PASSWORD: change-me-postgres-password
      POSTGRES_DB: cubemax
    ports:
      - "5432:5432"
    volumes:
      - cubemax-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cubemax -d cubemax"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cubemax-network

  redis:
    image: redis:8.2.2
    container_name: cubemax-redis
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      REDIS_PASSWORD: change-me-redis-password
    command: ["sh", "-c", "redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    ports:
      - "6379:6379"
    volumes:
      - cubemax-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" ping | grep -q PONG"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - cubemax-network

  cubemax:
    image: xzgzszrh/cubemax:latest
    container_name: cubemax-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "4090:4090"
    environment:
      TZ: Asia/Shanghai
      NODE_ENV: production

      # Base
      APP_NAME: CubeMax
      APP_DOMAIN: http://localhost:4090

      # Server
      SERVER_PORT: 4090
      SERVER_CORS_ENABLED: "true"
      SERVER_CORS_ORIGIN: "*"
      SERVER_SHOW_DETAILED_ERRORS: "false"
      SERVER_IS_DEMO_ENV: "false"

      # JWT: change this before public deployment.
      JWT_SECRET: change-me-to-a-long-random-secret
      JWT_EXPIRES_IN: 30d

      # Database
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: cubemax
      DB_PASSWORD: change-me-postgres-password
      DB_DATABASE: cubemax
      # For an empty first-time database, you can temporarily set this to "true".
      # Set it back to "false" after initialization.
      DB_SYNCHRONIZE: "false"
      DB_DEV_SYNCHRONIZE: "false"
      DB_LOGGING: "false"

      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USERNAME: ""
      REDIS_PASSWORD: change-me-redis-password
      REDIS_DB: 0
      REDIS_TTL: 86400
      REDIS_MAX_RECONNECT_ATTEMPTS: 5
      REDIS_RECONNECT_DELAY: 3000

      # Cache
      CACHE_TTL: 86400
      CACHE_MAX_ITEMS: 1000

      # Logs
      LOG_LEVELS: error,warn,debug,fatal
      LOG_WRITE_LEVELS: error,warn,debug,fatal,log
      LOG_TO_FILE: "true"
      LOG_DATABASE_SCHEMA: "false"
      LOG_CLEAN_INTERVAL: 3

      # Web/API prefixes
      VITE_PRODUCTION_APP_BASE_URL: ""
      VITE_APP_WEB_API_PREFIX: /api
      VITE_APP_CONSOLE_API_PREFIX: /consoleapi

      # Built-in MCP
      BUILTIN_MCP_SERVER_URLS: ""
      BUILTIN_MCP_DISCOVERY_TIMEOUT_MS: 10000

      # Tavily web search/extract tools
      TAVILY_API_KEY: ""
    volumes:
      - cubemax-storage:/app/storage
      - cubemax-logs:/app/logs
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://localhost:' + (process.env.SERVER_PORT || 4090) + '/consoleapi/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))",
        ]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    networks:
      - cubemax-network

volumes:
  cubemax-postgres-data:
  cubemax-redis-data:
  cubemax-storage:
  cubemax-logs:

networks:
  cubemax-network:
    driver: bridge
